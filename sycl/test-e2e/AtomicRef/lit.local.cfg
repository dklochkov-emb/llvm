# %{atomic16_flags}, %{atomic32_flags} and %{atomic64_flags} are the extra flags
# needed for full 16/32/64-bit atomic coverage on CRI devices. Tests build one
# binary per width unconditionally (per-device features are not available on
# build lines) and run them only on CRI devices, see e.g. max.cpp.
# Native CPU uses no extra flags because it cannot compile bfloat16 atomics.
# Only SPIR builds use the translator; other targets reject its flags with -Werror.
for width in ("16", "32", "64"):
    config.substitutions.append(
        (
            "%{atomic" + width + "_flags}",
            "%if target-spir %{ "
            "-DFULL_ATOMIC" + width + "_COVERAGE "
            "-fsycl-device-code-split=per_kernel "
            "-Xspirv-translator=spir64 "
            "-spirv-ext=+SPV_KHR_bfloat16,+SPV_INTEL_16bit_atomics "
            "%} %else %{ %}",
        )
    )
